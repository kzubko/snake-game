name: Build Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install WiX Toolset
        run: choco install wixtoolset --version=3.14.1 -y

      - name: Build with Maven
        run: mvn --batch-mode clean package

      - name: Prepare package input
        shell: powershell
        run: |
          Remove-Item package-input -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory package-input

          Copy-Item target\snake-game-1.0-SNAPSHOT.jar package-input\
          Copy-Item target\libs\*.jar package-input\

      - name: Build EXE installer
        shell: powershell
        run: |
          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory dist

          jpackage `
            --type exe `
            --name SnakeGame `
            --input package-input `
            --main-jar snake-game-1.0-SNAPSHOT.jar `
            --main-class Launcher `
            --icon src\main\resources\icon.ico `
            --dest dist `
            --win-menu `
            --win-shortcut `
            --win-dir-chooser

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: SnakeGame-Windows
          path: dist/*.exe